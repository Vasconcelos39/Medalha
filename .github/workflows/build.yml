name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Um push novo no mesmo branch/tag cancela a execução anterior.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,rpm,appimage
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Dependências do Linux
        if: runner.os == 'Linux'
        working-directory: .
        timeout-minutes: 30
        env:
          DEBIAN_FRONTEND: noninteractive
        # Normalmente leva menos de um minuto, mas de vez em quando o espelho da Azure
        # fica lento por 15 minutos ou mais. Cada tentativa tem um limite e, se não der,
        # a próxima usa o espelho da Canonical.
        run: |
          pkgs="libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav
            libgtk-layer-shell0"
          opts="-o DPkg::Lock::Timeout=120 -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for attempt in 1 2 3; do
            if timeout 180 sudo apt-get $opts update && timeout 420 sudo apt-get $opts install -y $pkgs; then
              exit 0
            fi
            echo "::warning::apt falhou ou passou do tempo na tentativa $attempt"
            sudo dpkg --configure -a || true
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list
            if [ -f /etc/apt/apt-mirrors.txt ]; then sudo sed -i '/azure.archive.ubuntu.com/d' /etc/apt/apt-mirrors.txt; fi
          done
          exit 1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Testes
        run: cargo test --locked

      - name: Build
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: medalha-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # Uma tag v* publica os instaladores das duas plataformas numa única release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Notas da versão
        run: |
          # Seção "## vX.Y.Z" do CHANGELOG.md, até a próxima seção.
          awk -v tag="## ${GITHUB_REF_NAME}" '/^## / { p = index($0, tag) == 1 } p' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Medalha ${GITHUB_REF_NAME}" > notes.md; fi
          cat notes.md
          find dist -type f

      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            dist/**/*.exe
            dist/**/*.deb
            dist/**/*.rpm
            dist/**/*.AppImage
          fail_on_unmatched_files: true
