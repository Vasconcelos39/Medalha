[package]
name = "medalha"
version = "0.3.2"
description = "Cliente desktop não oficial do Medal com replay buffer para Linux e Windows"
authors = ["Vasconcelos39"]
license = "MIT"
repository = "https://github.com/Vasconcelos39/Medalha"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "tray-icon", "protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
notify = "8"
trash = "5"
ureq = { version = "2", features = ["json"] }

[target.'cfg(windows)'.dependencies]
cpal = "0.15"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Mesmas versões que o Tauri usa: o layout dos webviews no Linux mexe direto no GTK.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "abort"
