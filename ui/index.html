<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Medalha</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M7 2h4l2 6H9z" fill="var(--ribbon-a)"/>
        <path d="M13 2h4l-2 6h-4z" fill="var(--ribbon-b)"/>
        <circle cx="12" cy="15" r="7" fill="var(--accent)"/>
        <circle cx="12" cy="15" r="4.2" fill="none" stroke="var(--accent-ink)" stroke-width="1.6"/>
      </svg>
      <span>Medalha</span>
    </div>

    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="medal" aria-selected="true">Medal</button>
      <button class="tab" role="tab" data-tab="clips" aria-selected="false">
        Clipes <span class="count" id="clip-count"></span>
      </button>
    </nav>

    <div class="webnav" id="webnav">
      <button class="icon-btn" data-nav="back" title="Voltar">
        <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <button class="icon-btn" data-nav="forward" title="Avançar">
        <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <button class="icon-btn" data-nav="reload" title="Recarregar">
        <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
      </button>
      <button class="icon-btn" data-nav="home" title="Início do Medal">
        <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 10v10h12V10"/></svg>
      </button>
    </div>

    <div class="spacer"></div>

    <button class="status" id="status" title="Ligar ou desligar o buffer">
      <span class="dot"></span>
      <span class="status-text" id="status-text">Buffer desligado</span>
    </button>
    <button class="primary" id="save-btn" title="Salvar os últimos segundos">
      <span>Salvar clipe</span>
      <kbd id="hotkey-label">F8</kbd>
    </button>
    <button class="ghost update-btn" id="update-btn" hidden></button>
    <button class="icon-btn" id="settings-btn" title="Configurações">
      <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <!-- A aba Medal é um webview nativo posicionado pelo Rust sobre esta área. -->
  <main id="view-medal" class="view">
    <div class="placeholder">Carregando medal.tv…</div>
  </main>

  <main id="view-clips" class="view" hidden>
    <div class="toolbar">
      <h1>Clipes</h1>
      <input type="search" id="search" placeholder="Buscar clipes" autocomplete="off">
      <select id="game-filter" title="Filtrar por jogo" hidden></select>
      <div class="spacer"></div>
      <button class="ghost" id="open-dir">
        <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        Abrir pasta
      </button>
    </div>
    <div id="banner" class="banner" hidden></div>
    <div id="grid" class="grid"></div>
    <p id="no-match" class="no-match" hidden>Nenhum clipe com esse filtro.</p>
    <div id="empty" class="empty" hidden>
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9.5v5l4-2.5z"/></svg>
      <h2>Nenhum clipe ainda</h2>
      <p>Com o buffer ligado, aperte <kbd class="hotkey-inline">F8</kbd> durante o jogo para salvar os últimos segundos.</p>
    </div>
  </main>

  <!-- Player -->
  <dialog id="player" class="modal player">
    <div class="modal-head">
      <h2 id="player-title"></h2>
      <div class="spacer"></div>
      <button class="ghost" id="player-open">Abrir no player do sistema</button>
      <button class="icon-btn" data-close title="Fechar">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <video id="player-video" controls preload="metadata"></video>
    <div class="trim" id="trim" hidden>
      <div class="trim-track" id="trim-track" title="Clique para ir até o ponto; arraste as alças para cortar">
        <div class="trim-sel" id="trim-sel"></div>
        <div class="trim-head" id="trim-head"></div>
        <div class="trim-handle" data-edge="start" title="Início do corte"></div>
        <div class="trim-handle" data-edge="end" title="Fim do corte"></div>
      </div>
      <div class="trim-bar">
        <button class="ghost" id="trim-in" title="Marcar o início no ponto atual">Início aqui <kbd>I</kbd></button>
        <button class="ghost" id="trim-out" title="Marcar o fim no ponto atual">Fim aqui <kbd>O</kbd></button>
        <span class="trim-label" id="trim-label"></span>
        <div class="spacer"></div>
        <button class="ghost" id="trim-reset">Limpar</button>
        <button class="primary" id="trim-save" title="Salva o trecho como um clipe novo, sem mexer no original">Salvar corte</button>
      </div>
    </div>
  </dialog>

  <!-- Renomear / confirmar. Cancelar é type=button para o Enter confirmar. -->
  <dialog id="prompt" class="modal small">
    <form method="dialog">
      <h2 id="prompt-title"></h2>
      <p id="prompt-text"></p>
      <input id="prompt-input" type="text" autocomplete="off">
      <div class="actions">
        <button type="button" class="ghost" data-close>Cancelar</button>
        <button value="ok" class="primary" id="prompt-ok">OK</button>
      </div>
    </form>
  </dialog>

  <dialog id="settings" class="modal settings">
    <form id="settings-form" method="dialog">
      <div class="modal-head">
        <h2>Configurações</h2>
        <div class="spacer"></div>
        <button type="button" class="icon-btn" data-close title="Fechar">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <div class="settings-body">
        <section class="group">
          <h3>Gravação</h3>
          <div class="rows">
            <label class="row">
              <span class="row-text">Duração do clipe<small>Quantos segundos o buffer guarda.</small></span>
              <span class="unit"><input name="bufferSecs" type="number" min="5" max="600" step="5"> s</span>
            </label>
            <label class="row">
              <span class="row-text">Quadros por segundo</span>
              <select name="fps">
                <option value="30">30</option>
                <option value="60">60</option>
                <option value="120">120</option>
                <option value="144">144</option>
              </select>
            </label>
            <label class="row">
              <span class="row-text">Qualidade<small>Mais qualidade, arquivos maiores.</small></span>
              <select name="quality">
                <option value="medium">Média</option>
                <option value="high">Alta</option>
                <option value="ultra">Ultra</option>
              </select>
            </label>
            <label class="row">
              <span class="row-text">Resolução máxima</span>
              <select name="resolution">
                <option value="native">Nativa</option>
                <option value="1440">1440p</option>
                <option value="1080">1080p</option>
                <option value="720">720p</option>
              </select>
            </label>
            <label class="row">
              <span class="row-text">Monitor<small>0 é o principal.</small></span>
              <input name="monitor" type="number" min="0" max="8">
            </label>
          </div>
        </section>

        <section class="group">
          <h3>Áudio</h3>
          <div class="rows">
            <label class="row">
              <span class="row-text">Som do sistema<small>Jogo, Discord, música.</small></span>
              <input name="systemAudio" type="checkbox" class="switch">
            </label>
            <label class="row">
              <span class="row-text">Microfone</span>
              <input name="mic" type="checkbox" class="switch">
            </label>
          </div>
        </section>

        <section class="group">
          <h3>Atalho</h3>
          <div class="rows">
            <label class="row">
              <span class="row-text">Salvar clipe<small>Clique no campo e aperte a combinação.</small></span>
              <input name="hotkey" id="hotkey-input" readonly placeholder="Nenhum">
            </label>
          </div>
          <p class="hint" id="hotkey-hint" hidden></p>
        </section>

        <section class="group">
          <h3>Clipes</h3>
          <div class="rows">
            <div class="row stack">
              <label class="row-text" for="clips-dir">Pasta dos clipes</label>
              <span class="field">
                <input name="clipsDir" id="clips-dir" type="text">
                <button type="button" class="ghost" id="pick-dir">Escolher…</button>
              </span>
            </div>
            <label class="row">
              <span class="row-text">Nome do jogo no arquivo<small>Usa a janela em foco na hora de salvar.</small></span>
              <input name="gameInName" type="checkbox" class="switch">
            </label>
            <label class="row">
              <span class="row-text">Aviso ao salvar<small>Também avisa quando um clipe não pôde ser salvo.</small></span>
              <input name="notifyOnSave" type="checkbox" class="switch">
            </label>
            <label class="row">
              <span class="row-text">Card por cima do jogo<small>Como o do Medal. Desligado, ou onde não funcionar, usa a notificação do sistema.</small></span>
              <input name="overlayOnSave" type="checkbox" class="switch">
            </label>
            <label class="row">
              <span class="row-text">Som ao salvar</span>
              <input name="soundOnSave" type="checkbox" class="switch">
            </label>
          </div>
        </section>

        <section class="group">
          <h3>Sistema</h3>
          <div class="rows">
            <label class="row">
              <span class="row-text">Iniciar com o sistema<small>Abre minimizado na bandeja.</small></span>
              <input name="autostart" type="checkbox" class="switch">
            </label>
            <label class="row">
              <span class="row-text">Ligar o buffer ao abrir</span>
              <input name="startOnLaunch" type="checkbox" class="switch">
            </label>
            <label class="row">
              <span class="row-text">Fechar para a bandeja<small>O X esconde a janela e o buffer continua.</small></span>
              <input name="closeToTray" type="checkbox" class="switch">
            </label>
            <!-- div, não label: com o botão dentro, clicar no texto acionaria o botão. -->
            <div class="row">
              <span class="row-text">Procurar atualizações<small id="update-check-text">Avisa quando sair uma versão nova.</small></span>
              <button type="button" class="ghost" id="check-update">Procurar agora</button>
              <input name="checkUpdates" type="checkbox" class="switch" aria-label="Procurar atualizações sozinho">
            </div>
          </div>
        </section>

        <details class="group advanced">
          <summary>Avançado</summary>
          <div class="rows">
            <label class="row">
              <span class="row-text">Gravador</span>
              <select name="backend">
                <option value="auto">Automático</option>
                <option value="ffmpeg">ffmpeg</option>
                <option value="gsr" data-linux>gpu-screen-recorder</option>
              </select>
            </label>
            <label class="row">
              <span class="row-text">Encoder do ffmpeg</span>
              <select name="encoder">
                <option value="auto">Automático</option>
                <option value="h264_nvenc">NVIDIA NVENC</option>
                <option value="h264_amf" data-windows>AMD AMF</option>
                <option value="h264_qsv" data-windows>Intel Quick Sync</option>
                <option value="h264_vaapi" data-linux>VA-API</option>
                <option value="libx264">CPU (x264)</option>
              </select>
            </label>
            <label class="row" data-linux>
              <span class="row-text">Captura do gpu-screen-recorder</span>
              <select name="gsrCapture">
                <option value="auto">Automática</option>
                <option value="screen">Tela inteira (KMS)</option>
                <option value="portal">Portal do desktop</option>
                <option value="focused">Janela em foco (X11)</option>
              </select>
            </label>
            <div class="row stack">
              <label class="row-text" for="ffmpeg-path">Caminho do ffmpeg</label>
              <input name="ffmpegPath" id="ffmpeg-path" type="text" placeholder="Detectar automaticamente">
            </div>
          </div>
          <dl id="diag" class="diag"></dl>
        </details>
      </div>

      <div class="actions">
        <button type="button" class="ghost" data-close>Cancelar</button>
        <button value="save" class="primary">Salvar</button>
      </div>
    </form>
  </dialog>

  <dialog id="update" class="modal update-modal">
    <div class="modal-head">
      <h2 id="update-title"></h2>
      <div class="spacer"></div>
      <button type="button" class="icon-btn" data-close title="Fechar">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="update-body">
      <div class="notes" id="update-notes"></div>
      <p class="update-status" id="update-status"></p>
    </div>
    <div class="actions">
      <button type="button" class="ghost" data-close>Depois</button>
      <button type="button" class="primary" id="update-go"></button>
    </div>
  </dialog>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
